about: >-
  Hi, I'm Abhijeet Anand, a Software Engineer at Tata Consultancy Services with
  a passion for building scalable applications, solving complex problems, and
  continuously learning new technologies. I graduated in 2024 from Jodhpur
  Institute of Engineering and Technology and currently work in the cloud and
  enterprise technology space, where I gain hands-on experience with large-scale
  systems, monitoring, infrastructure, and production environments.


  My core expertise spans Java, Spring Boot, React, SQL, Azure, DevOps, Kubernetes, System Design and AI/ML. Beyond my day job, I love exploring SaaS platforms, automation, cloud solutions and AI/ML applications — and turning those explorations into real, shipped projects.
